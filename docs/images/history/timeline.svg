<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="420" viewBox="0 0 1220 420" role="img" aria-labelledby="title desc"><title id="title">Obligationsmarkedets historie</title><desc id="desc">Ti nedslag fra Venedig til finanskrisen. Læs hver række fra venstre mod højre, øverste række først. Afstandene er ikke en tidsskala.</desc><rect width="1220" height="420" fill="#fafaf7"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#008b8c"/></marker></defs><path d="M75 135 H1165" fill="none" stroke="#b7cdcc" stroke-width="3" marker-end="url(#arrow)"/><path d="M75 335 H1165" fill="none" stroke="#b7cdcc" stroke-width="3" marker-end="url(#arrow)"/><path d="M1175 145 V190 H45 V330 H65" fill="none" stroke="#b7cdcc" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><circle cx="135" cy="135" r="7" fill="#008b8c"/><text x="135" y="47" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">1171–72</text><text x="135" y="84" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Venedig</text><text x="135" y="115" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Krigslån</text><circle cx="372" cy="135" r="7" fill="#008b8c"/><text x="372" y="47" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">1648</text><text x="372" y="84" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Nederlandene</text><text x="372" y="115" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Et digelån</text><circle cx="609" cy="135" r="7" fill="#008b8c"/><text x="609" y="47" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">1694</text><text x="609" y="84" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">England</text><text x="609" y="115" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Bank of England</text><circle cx="846" cy="135" r="7" fill="#008b8c"/><text x="846" y="47" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">1790</text><text x="846" y="84" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">USA</text><text x="846" y="115" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Hamiltons reform</text><circle cx="1083" cy="135" r="7" fill="#008b8c"/><text x="1083" y="47" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">1795–97</text><text x="1083" y="84" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">København</text><text x="1083" y="115" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Brand og kreditkasse</text><circle cx="135" cy="335" r="7" fill="#008b8c"/><text x="135" y="247" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">1803</text><text x="135" y="284" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">USA</text><text x="135" y="315" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Louisiana-købet</text><circle cx="372" cy="335" r="7" fill="#008b8c"/><text x="372" y="247" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">1917–18</text><text x="372" y="284" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">USA</text><text x="372" y="315" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Liberty Bonds</text><circle cx="609" cy="335" r="7" fill="#008b8c"/><text x="609" y="247" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">1970–80’erne</text><text x="609" y="284" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Milken</text><text x="609" y="315" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">High yield vokser</text><circle cx="846" cy="335" r="7" fill="#008b8c"/><text x="846" y="247" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">1970–80’erne</text><text x="846" y="284" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Ranieri</text><text x="846" y="315" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Boliglån på Wall Street</text><circle cx="1083" cy="335" r="7" fill="#008b8c"/><text x="1083" y="247" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">2007–09</text><text x="1083" y="284" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Finanskrisen</text><text x="1083" y="315" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Tab på risikable lån</text><text x="610" y="396" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="17">Udvalgte nedslag · Afstandene er ikk