<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="420" viewBox="0 0 1220 420" role="img" aria-labelledby="title desc"><title id="title">Obligationsmarkedets historie</title><desc id="desc">Syv udvalgte begivenheder fra Venedigs krigslån til Liberty Bonds. Afstandene er ikke en tidsskala.</desc><rect width="1220" height="420" fill="#fafaf7"/><path d="M65 200 H1160" stroke="#b7cdcc" stroke-width="5"/><path d="M1160 194 L1172 200 L1160 206" fill="#008b8c"/><path d="M85 200 V130" stroke="#008b8c" stroke-width="2"/><circle cx="85" cy="200" r="9" fill="#008b8c"/><circle cx="85" cy="200" r="4" fill="#fafaf7"/><text x="85" y="47" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">1171–72</text><text x="85" y="82" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650">Venedig</text><text x="85" y="111" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Krigslån</text><path d="M260 200 V270" stroke="#008b8c" stroke-width="2"/><circle cx="260" cy="200" r="9" fill="#008b8c"/><circle cx="260" cy="200" r="4" fill="#fafaf7"/><text x="260" y="309" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">1648</text><text x="260" y="344" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650">Nederlandene</text><text x="260" y="373" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Et digelån</text><path d="M435 200 V130" stroke="#008b8c" stroke-width="2"/><circle cx="435" cy="200" r="9" fill="#008b8c"/><circle cx="435" cy="200" r="4" fill="#fafaf7"/><text x="435" y="47" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">1694</text><text x="435" y="82" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650">England</text><text x="435" y="111" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Bank of England</text><path d="M610 200 V270" stroke="#008b8c" stroke-width="2"/><circle cx="610" cy="200" r="9" fill="#008b8c"/><circle cx="610" cy="200" r="4" fill="#fafaf7"/><text x="610" y="309" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">1790</text><text x="610" y="344" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650">USA</text><text x="610" y="373" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Hamiltons reform</text><path d="M785 200 V130" stroke="#008b8c" stroke-width="2"/><circle cx="785" cy="200" r="9" fill="#008b8c"/><circle cx="785" cy="200" r="4" fill="#fafaf7"/><text x="785" y="47" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">1795–97</text><text x="785" y="82" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650">København</text><text x="785" y="111" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Brand og kreditkasse</text><path d="M960 200 V270" stroke="#008b8c" stroke-width="2"/><circle cx="960" cy="200" r="9" fill="#008b8c"/><circle cx="960" cy="200" r="4" fill="#fafaf7"/><text x="960" y="309" text-anchor="middle" fill="#007f80" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650">1803</text><text x="960" y="344" text-anchor="middle" fill="#173545" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="650">USA</text><text x="960" y="373" text-anchor="middle" fill="#526770" font-family="Segoe UI, Arial, sans-